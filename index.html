  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX compilation in browser -->

  <!-- Firebase Compat Scripts for browser compilation -->

  <!-- Lucide Icons CDN -->

    ::-webkit-scrollbar-track {
      background: #09090B;

    ::-webkit-scrollbar-thumb {

      border-radius: 9999px;

    .no-scrollbar::-webkit-scrollbar {

</head>
<body class="bg-[#09090B] text-[#F4F4F5] font-sans antialiased selection:bg-[#E8DCC4] selection:text-[#09090B]">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Helper for rendering Lucide icons safely in browser React
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const iRef = useRef(null);
      useEffect(() => {
        if (iRef.current) {
          iRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          if (window.lucide) {
            window.lucide.createIcons({
              attrs: { class: className },
              nameAttr: 'data-lucide'
            });
          }
        }
      }, [name, className]);
      return <span ref={iRef} className="inline-flex items-center justify-center shrink-0"></span>;
    };

    // --- INITIAL DEFAULT DATA ---
    const INITIAL_QUOTES = [
      "Building an empire between lectures.",

      "Elegance is an attitude, execution is a strategy.",

      ],
      Tuesday: [

        { id: 's6', time: '10:15 - 11:45', subject: 'Terminale Math', room: 'Room 204' },
        { id: 's7', time: '13:30 - 15:00', subject: 'History / Geo', room: 'Room 110' },
        { id: 's8', time: '15:15 - 16:45', subject: 'Spanish', room: 'Room 208' }
      ],
      Wednesday: [
        { id: 's9', time: '08:30 - 10:00', subject: 'Terminale Math', room: 'Room 204' },
        { id: 's10', time: '10:15 - 12:15', subject: 'Philosophy', room: 'Room 102' }
      ],

        { id: 's12', time: '10:15 - 11:45', subject: 'Physics & Chem', room: 'Lab 3B' },
        { id: 's13', time: '13:30 - 15:00', subject: 'Terminale Math', room: 'Room 204' },
        { id: 's14', time: '15:15 - 16:45', subject: 'Economics / Tech', room: 'Lab 1A' }
      ],
      Friday: [
        { id: 's15', time: '08:30 - 10:00', subject: 'History / Geo', room: 'Room 110' },
        { id: 's16', time: '10:15 - 11:45', subject: 'Spanish', room: 'Room 208' },
        { id: 's17', time: '13:30 - 15:00', subject: 'Physics Lab', room: 'Lab 3B' },
        { id: 's18', time: '15:15 - 16:15', subject: 'Mentorship / Study', room: 'Library' }
      ]
    };

    const INITIAL_TASKS = [
      { 
        id: '1', 
        title: 'Calculus Ch. 4 Review Problems', 
        subject: 'Terminale Math', 
        priority: 'High', 
        estTime: '45m', 
        completed: false, 
        dueDate: 'Today',
        notes: 'Focus on composite function derivatives and integral limits. Pages 142-145.'
      },
      { 
        id: '2', 
        title: 'Draft Reels script for product launch', 
        subject: 'bayt al Ummah', 
        priority: 'High', 
        estTime: '30m', 
        completed: false, 
        dueDate: 'Today',
        notes: 'Hook: "What nobody tells you about starting a brand in high school..." Visual: Quick laptop cuts.'
      },
      { 
        id: '3', 
        title: 'Setup FastAPI router endpoints', 
        subject: 'Coding', 
        priority: 'Medium', 
        estTime: '1h', 
        completed: true, 
        dueDate: 'Tomorrow',
        notes: 'Use Pydantic v2 schemas for response validation.'
      }
    ];

    const INITIAL_FOLDERS = [
      { id: 'f1', name: 'Terminale Math', icon: '📐' },
      { id: 'f2', name: 'Physics & Chemistry', icon: '🔬' },
      { id: 'f3', name: 'Agency Ideas', icon: '💼' },
      { id: 'f4', name: 'IG Captions', icon: '📲' }
    ];

    const INITIAL_NOTES = [
      { id: 'n1', folderId: 'f1', title: 'Derivatives & Integrals Cheat Sheet', content: '# Core Formulas\n\n- f(x) = x^n -> f\'(x) = n*x^(n-1)\n- Integral of e^x = e^x + C\n\n*Key Exam Tip:* Remember to test boundary conditions when evaluating limits.' },
      { id: 'n2', folderId: 'f3', title: 'Client Outreach Script v2', content: 'Hey [Name],\n\nLoved your recent post on [Topic]! We recently helped a brand in your niche automate their backend API response time by 40%.\n\nWould love to send over a 2-minute video audit if you are open to it?' },
      { id: 'n3', folderId: 'f4', title: 'Autumn Collection Launch Captions', content: 'Draft 1:\nMinimalism isn\'t about having less. It\'s about making room for what matters.\n\n✨ Launching Friday at 6 PM EST. Turn on notifications.' }
    ];

    const INITIAL_IG_POSTS = [
      { 
        id: '1', 
        title: 'Day in the Life: High School & Founder', 
        status: 'Scheduled', 
        type: 'Reel', 
        notes: 'Audio track: Lofi ambient chill.\nCaption: Balancing Terminale prep and client work daily. Routine is everything ✨' 
      },
      { 
        id: '2', 
        title: '3 FastAPI Tips for Beginners', 
        status: 'Drafting', 
        type: 'Carousel', 
        notes: 'Slide 1: Why Async Matters\nSlide 2: Automatic Swagger Docs\nSlide 3: Dependency Injection' 
      }
    ];

    const INITIAL_CODE_GOALS = [
      { id: '1', text: 'Complete FastAPI OAuth2 auth flow', status: 'In Progress', notes: 'Using JWT tokens with 15m expiration.' },
      { id: '2', text: 'Refactor Python script for lead extraction', status: 'Done', notes: 'Optimized with BeautifulSoup + async requests.' },
      { id: '3', text: 'Send 5 personalized cold emails to agency prospects', status: 'Pending', notes: 'Target e-commerce founders in tech.' }
    ];

    function DashboardApp() {
      // --- FIREBASE CONFIGURATION STATE ---
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [customConfig, setCustomConfig] = useState(() => {
        const saved = localStorage.getItem('boss_custom_firebase_config');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          apiKey: "",
          authDomain: "",
          projectId: "",
          storageBucket: "",
          messagingSenderId: "",
          appId: ""
        };
      });

      const [dbInstance, setDbInstance] = useState(null);
      const [authInstance, setAuthInstance] = useState(null);
      const [user, setUser] = useState(null);
      const [syncing, setSyncing] = useState(false);

      // Initialize Firebase via Compat
      useEffect(() => {
        if (customConfig.apiKey && customConfig.projectId) {
          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(customConfig);
            }
            const auth = firebase.auth();
            const db = firebase.firestore();
            setAuthInstance(auth);
            setDbInstance(db);

            auth.signInAnonymously().catch(e => console.log("Anon auth:", e));
            const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
            return () => unsubscribe();
          } catch (err) {
            console.error("Firebase init error:", err);
          }
        }
      }, [customConfig]);

      // Dashboard State
      const [quoteIndex, setQuoteIndex] = useState(0);
      const [selectedDay, setSelectedDay] = useState('Monday');
      
      const [schedule, setSchedule] = useState(() => {
        const local = localStorage.getItem('boss_schedule');
        return local ? JSON.parse(local) : INITIAL_SCHEDULE;
      });
      const [tasks, setTasks] = useState(() => {
        const local = localStorage.getItem('boss_tasks');
        return local ? JSON.parse(local) : INITIAL_TASKS;
      });
      const [folders, setFolders] = useState(() => {
        const local = localStorage.getItem('boss_folders');
        return local ? JSON.parse(local) : INITIAL_FOLDERS;
      });
      const [notes, setNotes] = useState(() => {
        const local = localStorage.getItem('boss_notes');
        return local ? JSON.parse(local) : INITIAL_NOTES;
      });
      const [igPosts, setIgPosts] = useState(() => {
        const local = localStorage.getItem('boss_ig_posts');
        return local ? JSON.parse(local) : INITIAL_IG_POSTS;
      });
      const [codeGoals, setCodeGoals] = useState(() => {
        const local = localStorage.getItem('boss_code_goals');
        return local ? JSON.parse(local) : INITIAL_CODE_GOALS;
      });

      // Expandable drawers
      const [expandedTaskId, setExpandedTaskId] = useState(null);
      const [expandedIgId, setExpandedIgId] = useState(null);
      const [expandedGoalId, setExpandedGoalId] = useState(null);

      // Inputs
      const [newTaskTitle, setNewTaskTitle] = useState('');
      const [newTaskSubject, setNewTaskSubject] = useState('Terminale Math');
      const [newTaskPriority, setNewTaskPriority] = useState('Medium');
      const [newTaskTime, setNewTaskTime] = useState('30m');
      const [newTaskNote, setNewTaskNote] = useState('');

      const [isAddingClass, setIsAddingClass] = useState(false);
      const [newClassTime, setNewClassTime] = useState('08:30 - 10:00');
      const [newClassSubject, setNewClassSubject] = useState('');
      const [newClassRoom, setNewClassRoom] = useState('Room 101');

      const [activeExtraTab, setActiveExtraTab] = useState('ig');
      const [newIgTitle, setNewIgTitle] = useState('');
      const [newIgType, setNewIgType] = useState('Reel');
      const [newCodeGoal, setNewCodeGoal] = useState('');

      const [openedFolderId, setOpenedFolderId] = useState(null);
      const [activeNoteId, setActiveNoteId] = useState('n1');
      const [noteTitle, setNoteTitle] = useState('');
      const [noteContent, setNoteContent] = useState('');
      const [newFolderName, setNewFolderName] = useState('');
      const [isAddingFolder, setIsAddingFolder] = useState(false);

      const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

      // Sync data locally
      useEffect(() => {
        localStorage.setItem('boss_schedule', JSON.stringify(schedule));
        localStorage.setItem('boss_tasks', JSON.stringify(tasks));
        localStorage.setItem('boss_folders', JSON.stringify(folders));
        localStorage.setItem('boss_notes', JSON.stringify(notes));
        localStorage.setItem('boss_ig_posts', JSON.stringify(igPosts));
        localStorage.setItem('boss_code_goals', JSON.stringify(codeGoals));
        saveDataToCloud();
      }, [schedule, tasks, folders, notes, igPosts, codeGoals]);

      // Sync Firestore
      useEffect(() => {
        if (!user || !dbInstance) return;
        const userDocRef = dbInstance.collection('users').doc(user.uid);
        const unsubscribe = userDocRef.onSnapshot((docSnap) => {
          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.schedule) setSchedule(data.schedule);
            if (data.tasks) setTasks(data.tasks);
            if (data.folders) setFolders(data.folders);
            if (data.notes) setNotes(data.notes);
            if (data.igPosts) setIgPosts(data.igPosts);
            if (data.codeGoals) setCodeGoals(data.codeGoals);
          }
        });
        return () => unsubscribe();
      }, [user, dbInstance]);

      const saveDataToCloud = () => {
        if (!user || !dbInstance) return;
        setSyncing(true);
        dbInstance.collection('users').doc(user.uid).set({
          schedule, tasks, folders, notes, igPosts, codeGoals,
          updatedAt: new Date().toISOString()
        }, { merge: true })
        .then(() => setSyncing(false))
        .catch(err => {
          console.error("Cloud save error:", err);
          setSyncing(false);
        });
      };

      // Note Editor Sync
      useEffect(() => {
        const active = notes.find(n => n.id === activeNoteId);
        if (active) {
          setNoteTitle(active.title);
          setNoteContent(active.content);
        } else {
          const targetFolderId = openedFolderId || (folders[0] ? folders[0].id : null);
          if (targetFolderId) {
            const folderNotes = notes.filter(n => n.folderId === targetFolderId);
            if (folderNotes.length > 0) {
              setActiveNoteId(folderNotes[0].id);
              setNoteTitle(folderNotes[0].title);
              setNoteContent(folderNotes[0].content);
            } else {
              setNoteTitle('');
              setNoteContent('');
            }
          }
        }
      }, [activeNoteId, openedFolderId, notes]);

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem('boss_custom_firebase_config', JSON.stringify(customConfig));
        setShowConfigModal(false);
        window.location.reload();
      };

      // Task actions
      const addTask = (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        const task = {
          id: Date.now().toString(),
          title: newTaskTitle,
          subject: newTaskSubject,
          priority: newTaskPriority,
          estTime: newTaskTime,
          completed: false,
          dueDate: 'Today',
          notes: newTaskNote
        };
        setTasks([task, ...tasks]);
        setNewTaskTitle('');
        setNewTaskNote('');
      };

      const updateTaskNote = (id, text) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, notes: text } : t));
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      // Schedule actions
      const addClassToSchedule = (e) => {
        e.preventDefault();
        if (!newClassSubject.trim()) return;
        const newSlot = {
          id: Date.now().toString(),
          time: newClassTime,
          subject: newClassSubject,
          room: newClassRoom
        };
        setSchedule({
          ...schedule,
          [selectedDay]: [...(schedule[selectedDay] || []), newSlot]
        });
        setNewClassSubject('');
        setIsAddingClass(false);
      };

      const deleteClass = (id) => {
        setSchedule({
          ...schedule,
          [selectedDay]: (schedule[selectedDay] || []).filter(item => item.id !== id)
        });
      };

      // Extracurriculars
      const addIgPost = (e) => {
        e.preventDefault();
        if (!newIgTitle.trim()) return;
        setIgPosts([...igPosts, {
          id: Date.now().toString(),
          title: newIgTitle,
          type: newIgType,
          status: 'Drafting',
          notes: ''
        }]);
        setNewIgTitle('');
      };

      const updateIgNote = (id, text) => {
        setIgPosts(igPosts.map(p => p.id === id ? { ...p, notes: text } : p));
      };

      const deleteIgPost = (id) => {
        setIgPosts(igPosts.filter(p => p.id !== id));
      };

      const addCodeGoal = (e) => {
        e.preventDefault();
        if (!newCodeGoal.trim()) return;
        setCodeGoals([...codeGoals, {
          id: Date.now().toString(),
          text: newCodeGoal,
          status: 'In Progress',
          notes: ''
        }]);
        setNewCodeGoal('');
      };

      const updateGoalNote = (id, text) => {
        setCodeGoals(codeGoals.map(g => g.id === id ? { ...g, notes: text } : g));
      };

      const toggleCodeGoal = (id) => {
        setCodeGoals(codeGoals.map(g => g.id === id ? { ...g, status: g.status === 'Done' ? 'In Progress' : 'Done' } : g));
      };

      const deleteCodeGoal = (id) => {
        setCodeGoals(codeGoals.filter(g => g.id !== id));
      };

      // Note Vault
      const createFolder = (e) => {
        e.preventDefault();
        if (!newFolderName.trim()) return;
        const newF = { id: 'f_' + Date.now(), name: newFolderName, icon: '📁' };
        setFolders([...folders, newF]);
        setOpenedFolderId(newF.id);
        setNewFolderName('');
        setIsAddingFolder(false);
      };

      const deleteFolder = (id, e) => {
        e.stopPropagation();
        if (folders.length <= 1) return;
        setFolders(folders.filter(f => f.id !== id));
        setNotes(notes.filter(n => n.folderId !== id));
        if (openedFolderId === id) setOpenedFolderId(null);
      };

      const createNewNote = () => {
        const targetFolderId = openedFolderId || (folders[0] ? folders[0].id : 'f1');
        const newNote = { id: 'n_' + Date.now(), folderId: targetFolderId, title: 'Untitled Document', content: '' };
        setNotes([newNote, ...notes]);
        setActiveNoteId(newNote.id);
      };

      const deleteNote = (id, e) => {
        e.stopPropagation();
        setNotes(notes.filter(n => n.id !== id));
      };

      const handleNoteChange = (field, value) => {
        if (field === 'title') setNoteTitle(value);
        if (field === 'content') setNoteContent(value);
        setNotes(notes.map(n => n.id === activeNoteId ? { ...n, [field]: value } : n));
      };

      const sortedTasks = [...tasks].sort((a, b) => {
        const priorityWeight = { High: 3, Medium: 2, Low: 1 };
        if (a.completed === b.completed) {
          return priorityWeight[b.priority] - priorityWeight[a.priority];
        }
        return a.completed ? 1 : -1;
      });

      const todayFormatted = new Date().toLocaleDateString('en-US', {
        weekday: 'long', month: 'short', day: 'numeric'
      });

      const currentOpenedFolder = folders.find(f => f.id === openedFolderId);
      const currentFolderNotes = notes.filter(n => n.folderId === openedFolderId);

      return (
        <div className="min-h-screen pb-16">
          
          {/* Header */}
          <header className="border-b border-[#27272A] bg-[#09090B]/90 sticky top-0 z-30 backdrop-blur-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              <div className="flex items-center space-x-3.5">
                <div className="w-10 h-10 rounded-xl bg-[#E8DCC4] text-[#09090B] flex items-center justify-center font-bold text-lg shadow-md">
                  F
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-[#FFFFFF]">Welcome back, Founder</h1>
                  <p className="text-xs text-[#A1A1AA] font-medium flex items-center gap-1.5 mt-0.5">
                    <Icon name="calendar" className="w-3.5 h-3.5 text-[#71717A]" />
                    {todayFormatted}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowConfigModal(true)}
                  className="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium bg-[#18181B] border border-[#27272A] text-[#A1A1AA] hover:border-[#E8DCC4] transition-colors cursor-pointer"
                >
                  <Icon name={dbInstance ? "cloud" : "database"} className={`w-3.5 h-3.5 ${dbInstance ? "text-emerald-400" : "text-amber-400"}`} />
                  <span className="text-[#E4E4E7]">{dbInstance ? "Cloud Sync Active" : "Connect Cloud"}</span>
                  <Icon name="settings" className="w-3 h-3 text-[#71717A] ml-1" />
                </button>

                <span className="hidden md:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-[#18181B] border border-[#27272A] text-[#E8DCC4]">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  Terminale &bull; Tech Founder
                </span>
              </div>
            </div>
          </header>

          {/* Config Modal */}
          {showConfigModal && (
            <div className="fixed inset-0 bg-[#09090B]/80 backdrop-blur-xs z-50 flex items-center justify-center p-4">
              <div className="bg-[#18181B] border border-[#27272A] rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-[#27272A] pb-3">
                  <div className="flex items-center gap-2">
                    <Icon name="database" className="w-5 h-5 text-[#E8DCC4]" />
                    <h3 className="text-sm font-bold text-[#FFFFFF]">Firebase Configuration</h3>
                  </div>
                  <button onClick={() => setShowConfigModal(false)} className="text-[#71717A] hover:text-[#FFFFFF]">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <p className="text-xs text-[#A1A1AA]">
                  Connect your personal Firebase project to enable cross-device live database syncing.
                </p>

                <form onSubmit={handleSaveConfig} className="space-y-3">
                  <div>
                    <label className="text-[10px] font-mono text-[#71717A] uppercase">API Key</label>
                    <input
                      type="text"
                      value={customConfig.apiKey || ''}
                      onChange={(e) => setCustomConfig({ ...customConfig, apiKey: e.target.value })}
                      placeholder="AIzaSy..."
                      className="w-full text-xs bg-[#09090B] border border-[#27272A] rounded-lg px-3 py-2 text-[#FFFFFF] outline-none focus:border-[#E8DCC4]"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-mono text-[#71717A] uppercase">Auth Domain</label>
                      <input
                        type="text"
                        value={customConfig.authDomain || ''}
                        onChange={(e) => setCustomConfig({ ...customConfig, authDomain: e.target.value })}
                        placeholder="app.firebaseapp.com"
                        className="w-full text-xs bg-[#09090B] border border-[#27272A] rounded-lg px-3 py-2 text-[#FFFFFF] outline-none focus:border-[#E8DCC4]"
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-mono text-[#71717A] uppercase">Project ID</label>
                      <input
                        type="text"
                        value={customConfig.projectId || ''}
                        onChange={(e) => setCustomConfig({ ...customConfig, projectId: e.target.value })}
                        placeholder="my-project"
                        className="w-full text-xs bg-[#09090B] border border-[#27272A] rounded-lg px-3 py-2 text-[#FFFFFF] outline-none focus:border-[#E8DCC4]"
                      />
                    </div>
                  </div>

                          value={noteContent}
                          onChange={(e) => handleNoteChange('content', e.target.value)}
                          className="w-full flex-1 text-xs text-[#D4D4D8] font-mono bg-transparent resize-none outline-none"
                          rows={9}
                        />
                      </>
                    ) : (
                      <div className="h-full flex items-center justify-center text-center">
                        <p className="text-xs text-[#71717A]">Select or create a document to start editing</p>
                      </div>
                    )}
                  </div>

                </div>
              </section>

            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
  </script>
</body>
</html>
