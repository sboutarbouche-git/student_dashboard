    function DashboardApp() {
      // Firebase Config Modal & Auth State
      const [showConfigModal, setShowConfigModal] = useState(false);
      const [customConfig, setCustomConfig] = useState(() => {
        const saved = localStorage.getItem('boss_custom_firebase_config');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          apiKey: "",
          authDomain: "",
          projectId: "",
          storageBucket: "",
          messagingSenderId: "",
          appId: ""
        };
      });

      const [dbInstance, setDbInstance] = useState(null);
      const [authInstance, setAuthInstance] = useState(null);
      const [user, setUser] = useState(null);
      const [syncing, setSyncing] = useState(false);

      // Auth form state
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [isRegistering, setIsRegistering] = useState(false);
      const [authError, setAuthError] = useState('');

      // Initialize Firebase via Compat
      useEffect(() => {
        if (customConfig.apiKey && customConfig.projectId && window.firebase) {
          try {
            if (!window.firebase.apps.length) {
              window.firebase.initializeApp(customConfig);
            }
            const auth = window.firebase.auth();
            const db = window.firebase.firestore();
            setAuthInstance(auth);
            setDbInstance(db);

            const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
            return () => unsubscribe();
          } catch (err) {
            console.error("Firebase init error:", err);
          }
        }
      }, [customConfig]);

      // Handle Email Auth Sign In / Register
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!authInstance) {
          setAuthError('Please configure your Firebase keys first!');
          return;
        }
        try {
          if (isRegistering) {
            await authInstance.createUserWithEmailAndPassword(email, password);
          } else {
            await authInstance.signInWithEmailAndPassword(email, password);
          }
        } catch (err) {
          setAuthError(err.message);
        }
      };

      const handleSignOut = () => {
        if (authInstance) {
          authInstance.signOut();
        }
      };

      // Main Dashboard State
      const [quoteIndex, setQuoteIndex] = useState(0);
      const [selectedDay, setSelectedDay] = useState('Monday');
      
      const [schedule, setSchedule] = useState(() => {
        const local = localStorage.getItem('boss_schedule');
        return local ? JSON.parse(local) : INITIAL_SCHEDULE;
      });
      const [tasks, setTasks] = useState(() => {
        const local = localStorage.getItem('boss_tasks');
        return local ? JSON.parse(local) : INITIAL_TASKS;
      });
      const [folders, setFolders] = useState(() => {
        const local = localStorage.getItem('boss_folders');
        return local ? JSON.parse(local) : INITIAL_FOLDERS;
      });
      const [notes, setNotes] = useState(() => {
        const local = localStorage.getItem('boss_notes');
        return local ? JSON.parse(local) : INITIAL_NOTES;
      });
      const [igPosts, setIgPosts] = useState(() => {
        const local = localStorage.getItem('boss_ig_posts');
        return local ? JSON.parse(local) : INITIAL_IG_POSTS;
      });
      const [codeGoals, setCodeGoals] = useState(() => {
        const local = localStorage.getItem('boss_code_goals');
        return local ? JSON.parse(local) : INITIAL_CODE_GOALS;
      });
      const [calendarNotes, setCalendarNotes] = useState(() => {
        const local = localStorage.getItem('boss_calendar_notes');
        return local ? JSON.parse(local) : INITIAL_CALENDAR_NOTES;
      });

      // Calendar Navigation & Day Note Modal State
      const [calendarViewDate, setCalendarViewDate] = useState(new Date());
      const [selectedCalDateStr, setSelectedCalDateStr] = useState(null);
      const [calModalText, setCalModalText] = useState('');

      // Expandable drawers
      const [expandedTaskId, setExpandedTaskId] = useState(null);
      const [expandedIgId, setExpandedIgId] = useState(null);
      const [expandedGoalId, setExpandedGoalId] = useState(null);

      // Input States
      const [newTaskTitle, setNewTaskTitle] = useState('');
      const [newTaskSubject, setNewTaskSubject] = useState('Terminale Math');
      const [newTaskPriority, setNewTaskPriority] = useState('Medium');
      const [newTaskTime, setNewTaskTime] = useState('30m');
      const [newTaskNote, setNewTaskNote] = useState('');

      const [isAddingClass, setIsAddingClass] = useState(false);
      const [newClassTime, setNewClassTime] = useState('08:30 - 10:00');
      const [newClassSubject, setNewClassSubject] = useState('');
      const [newClassRoom, setNewClassRoom] = useState('Room 101');

      const [activeExtraTab, setActiveExtraTab] = useState('ig');
      const [newIgTitle, setNewIgTitle] = useState('');
      const [newIgType, setNewIgType] = useState('Reel');
      const [newCodeGoal, setNewCodeGoal] = useState('');

      const [openedFolderId, setOpenedFolderId] = useState(null);
      const [activeNoteId, setActiveNoteId] = useState('n1');
      const [noteTitle, setNoteTitle] = useState('');
      const [noteContent, setNoteContent] = useState('');
      const [newFolderName, setNewFolderName] = useState('');
      const [isAddingFolder, setIsAddingFolder] = useState(false);

      const daysOfWeek = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];

      // Cloud Save Helper
      const saveDataToCloud = (overrideData) => {
        try {
          const payload = overrideData || {
            schedule, tasks, folders, notes, igPosts, codeGoals, calendarNotes,
            updatedAt: new Date().toISOString()
          };
          
          // Save to LocalStorage
          if (payload.schedule) localStorage.setItem('boss_schedule', JSON.stringify(payload.schedule));
          if (payload.tasks) localStorage.setItem('boss_tasks', JSON.stringify(payload.tasks));
          if (payload.folders) localStorage.setItem('boss_folders', JSON.stringify(payload.folders));
          if (payload.notes) localStorage.setItem('boss_notes', JSON.stringify(payload.notes));
          if (payload.igPosts) localStorage.setItem('boss_ig_posts', JSON.stringify(payload.igPosts));
          if (payload.codeGoals) localStorage.setItem('boss_code_goals', JSON.stringify(payload.codeGoals));
          if (payload.calendarNotes) localStorage.setItem('boss_calendar_notes', JSON.stringify(payload.calendarNotes));

          // Save to Firestore if connected
          if (!user || !dbInstance) return;
          setSyncing(true);
          dbInstance.collection('users').doc(user.uid).set(payload, { merge: true })
          .then(() => setSyncing(false))
          .catch(err => {
            console.error("Firestore write error:", err);
            setSyncing(false);
          });
        } catch (err) {
          console.error("Storage error:", err);
        }
      };

      // Cloud Listener (User specific)
      useEffect(() => {
        if (!user || !dbInstance) return;
        const userDocRef = dbInstance.collection('users').doc(user.uid);
        const unsubscribe = userDocRef.onSnapshot((docSnap) => {
          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.schedule) setSchedule(data.schedule);
            if (data.tasks) setTasks(data.tasks);
            if (data.folders) setFolders(data.folders);
            if (data.notes) setNotes(data.notes);
            if (data.igPosts) setIgPosts(data.igPosts);
            if (data.codeGoals) setCodeGoals(data.codeGoals);
            if (data.calendarNotes) setCalendarNotes(data.calendarNotes);
          }
        });
        return () => unsubscribe();
      }, [user, dbInstance]);

      // Note Editor state sync
      useEffect(() => {
        const active = notes.find(n => n.id === activeNoteId);
        if (active) {
          setNoteTitle(active.title);
          setNoteContent(active.content);
        } else {
          const targetFolderId = openedFolderId || (folders[0] ? folders[0].id : null);
          if (targetFolderId) {
            const folderNotes = notes.filter(n => n.folderId === targetFolderId);
            if (folderNotes.length > 0) {
              setActiveNoteId(folderNotes[0].id);
              setNoteTitle(folderNotes[0].title);
              setNoteContent(folderNotes[0].content);
            } else {
              setNoteTitle('');
              setNoteContent('');
            }
          }
        }
      }, [activeNoteId, openedFolderId, notes]);

      const handleSaveConfig = (e) => {
        e.preventDefault();
        localStorage.setItem('boss_custom_firebase_config', JSON.stringify(customConfig));
        setShowConfigModal(false);
        window.location.reload();
      };

      // Calendar Actions
      const openCalendarDayModal = (dateStr) => {
        setSelectedCalDateStr(dateStr);
        setCalModalText(calendarNotes[dateStr] || '');
      };

      const saveCalendarDayNote = (e) => {
        if (e) e.preventDefault();
        if (!selectedCalDateStr) return;
        
        const updatedNotes = { ...calendarNotes };
        if (calModalText.trim()) {
          updatedNotes[selectedCalDateStr] = calModalText.trim();
        } else {
          delete updatedNotes[selectedCalDateStr];
        }
        
        setCalendarNotes(updatedNotes);
        setSelectedCalDateStr(null);
        setCalModalText('');
        saveDataToCloud({ schedule, tasks, folders, notes, igPosts, codeGoals, calendarNotes: updatedNotes });
      };

      const deleteCalendarDayNote = () => {
        if (!selectedCalDateStr) return;
        const updatedNotes = { ...calendarNotes };
        delete updatedNotes[selectedCalDateStr];
        setCalendarNotes(updatedNotes);
        setSelectedCalDateStr(null);
        setCalModalText('');
        saveDataToCloud({ schedule, tasks, folders, notes, igPosts, codeGoals, calendarNotes: updatedNotes });
      };

      // Task actions
      const addTask = (e) => {
        if (e) e.preventDefault();
        if (!newTaskTitle || !newTaskTitle.trim()) return;
        
        const task = {
          id: Date.now().toString(),
          title: newTaskTitle.trim(),
          subject: newTaskSubject || 'Terminale Math',
          priority: newTaskPriority || 'Medium',
          estTime: newTaskTime || '30m',
          completed: false,
          dueDate: 'Today',
          notes: newTaskNote || ''
        };
        
        const updatedTasks = [task, ...tasks];
        setTasks(updatedTasks);
        setNewTaskTitle('');
        setNewTaskNote('');
        
        saveDataToCloud({ schedule, tasks: updatedTasks, folders, notes, igPosts, codeGoals, calendarNotes });
      };

      const updateTaskNote = (id, text) => {
        const updatedTasks = tasks.map(t => t.id === id ? { ...t, notes: text } : t);
        setTasks(updatedTasks);
        saveDataToCloud({ schedule, tasks: updatedTasks, folders, notes, igPosts, codeGoals, calendarNotes });
      };

      const toggleTask = (id) => {
        const updatedTasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
        setTasks(updatedTasks);
        saveDataToCloud({ schedule, tasks: updatedTasks, folders, notes, igPosts, codeGoals, calendarNotes });
      };

      const deleteTask = (id) => {
        const updatedTasks = tasks.filter(t => t.id !== id);
        setTasks(updatedTasks);
        saveDataToCloud({ schedule, tasks: updatedTasks, folders, notes, igPosts, codeGoals, calendarNotes });
      };

      // Schedule actions
      const addClassToSchedule = (e) => {
        if (e) e.preventDefault();
        if (!newClassSubject.trim()) return;
        const newSlot = {
          id: Date.now().toString(),
          time: newClassTime,
          subject: newClassSubject,
          room: newClassRoom
        };
        const updatedSchedule = {
          ...schedule,
          [selectedDay]: [...(schedule[selectedDay] || []), newSlot]
        };
        setSchedule(updatedSchedule);
        setNewClassSubject('');
        setIsAddingClass(false);
        saveDataToCloud({ schedule: updatedSchedule, tasks, folders, notes, igPosts, codeGoals, calendarNotes });
      };

      const deleteClass = (id) => {
        const updatedSchedule = {
          ...schedule,

                          </div>
                          <div className="flex items-center gap-2">
                            <span className="px-2 py-0.5 text-[10px] font-mono bg-[#27272A] text-[#E8DCC4] rounded border border-[#3F3F46]">
                              {slot.room}
                            </span>
                            <button onClick={() => deleteClass(slot.id)} className="text-[#71717A] hover:text-red-400 p-1 opacity-0 group-hover:opacity-100 cursor-pointer">
                              <Icon name="trash-2" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </section>

              {/* Task Manager */}
              <section className="lg:col-span-7 bg-[#18181B] border border-[#27272A] rounded-xl p-6 flex flex-col">
                <div className="flex items-center justify-between mb-5">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📌</span>
                    <h2 className="text-base font-semibold text-[#FFFFFF]">Smart Task Manager</h2>
                  </div>
                  <span className="text-xs text-[#A1A1AA] bg-[#09090B] px-2.5 py-1 border border-[#27272A] rounded-md font-mono">
                    {tasks.filter(t => !t.completed).length} Pending
                  </span>
                </div>

                <form onSubmit={addTask} className="bg-[#09090B] border border-[#27272A] p-4 rounded-xl mb-5 space-y-3">
                  <div>
                    <label className="block text-[10px] font-mono text-[#71717A] uppercase mb-1">Task Description</label>
                    <input
                      type="text"
                      required
                      placeholder="What task needs execution?"
                      value={newTaskTitle}
                      onChange={(e) => setNewTaskTitle(e.target.value)}
                      className="w-full text-xs bg-[#18181B] border border-[#27272A] rounded-lg p-2.5 font-medium text-[#FFFFFF] outline-none focus:border-[#E8DCC4]"
                    />
                  </div>
                  <input
                    type="text"
                    placeholder="Add an optional note inside this task..."
                    value={newTaskNote}
                    onChange={(e) => setNewTaskNote(e.target.value)}
                    className="w-full text-[11px] bg-[#18181B] border border-[#27272A] rounded-lg px-2.5 py-1.5 text-[#A1A1AA] outline-none focus:border-[#E8DCC4]"
                  />
                  <div className="grid grid-cols-3 gap-2 pt-2 border-t border-[#18181B]">
                    <select value={newTaskSubject} onChange={(e) => setNewTaskSubject(e.target.value)} className="text-xs bg-[#18181B] border border-[#27272A] rounded-lg px-2.5 py-1.5 text-[#E4E4E7]">
                      <option value="Terminale Math">Terminale Math</option>
                      <option value="Physics">Physics &amp; Chem</option>
                      <option value="Philosophy">Philosophy</option>
                      <option value="English">English</option>
                      <option value="bayt al Ummah">bayt al Ummah</option>
                      <option value="Coding">Coding / Agency</option>
                    </select>
                    <select value={newTaskPriority} onChange={(e) => setNewTaskPriority(e.target.value)} className="text-xs bg-[#18181B] border border-[#27272A] rounded-lg px-2.5 py-1.5 text-[#E4E4E7]">
                      <option value="High">High Priority</option>
                      <option value="Medium">Medium Priority</option>
                      <option value="Low">Low Priority</option>
                    </select>
                    <select value={newTaskTime} onChange={(e) => setNewTaskTime(e.target.value)} className="text-xs bg-[#18181B] border border-[#27272A] rounded-lg px-2.5 py-1.5 text-[#E4E4E7]">
                      <option value="15m">15m</option>
                      <option value="30m">30m</option>
                      <option value="45m">45m</option>
                      <option value="1h">1h</option>
                      <option value="2h">2h</option>
                    </select>
                  </div>
                  <div className="flex justify-end pt-1">
                    <button 
                      type="submit" 
                      onClick={addTask}
                      className="px-4 py-1.5 text-xs font-bold bg-[#E8DCC4] text-[#09090B] rounded-lg cursor-pointer hover:bg-[#d4c3a3] transition-colors"
                    >
                      Save Task
                    </button>
                  </div>
                </form>

                <div className="space-y-2.5 max-h-[320px] overflow-y-auto pr-1">
                  {sortedTasks.map((task) => {
                    const isExpanded = expandedTaskId === task.id;
                    return (
                      <div key={task.id} className="p-3 bg-[#09090B] border border-[#27272A] rounded-xl space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <button
                              onClick={() => toggleTask(task.id)}
                              className={`w-5 h-5 rounded border flex items-center justify-center cursor-pointer ${
                                task.completed ? 'bg-[#E8DCC4] border-[#E8DCC4] text-[#09090B]' : 'border-[#3F3F46] bg-[#18181B]'
                              }`}
                            >
                              {task.completed && <Icon name="check-circle-2" className="w-3.5 h-3.5" />}
                            </button>
                            <div>
                              <p className={`text-xs font-medium ${task.completed ? 'line-through text-[#71717A]' : 'text-[#FFFFFF]'}`}>{task.title}</p>
                              <div className="flex items-center gap-2 mt-1">
                                <span className="text-[10px] px-2 py-0.5 rounded bg-[#18181B] text-[#A1A1AA] border border-[#27272A]">{task.subject}</span>
                                <span className="text-[10px] px-2 py-0.5 rounded bg-amber-950/60 text-amber-300 border border-amber-800/50">{task.priority}</span>
                                <span className="text-[10px] text-[#71717A] font-mono">{task.estTime}</span>
                              </div>
                            </div>
                          </div>
                          <div className="flex items-center gap-1.5">
                            <button onClick={() => setExpandedTaskId(isExpanded ? null : task.id)} className="p-1.5 rounded bg-[#18181B] border border-[#27272A] text-[#E8DCC4] cursor-pointer">
                              <Icon name="file-text" className="w-3.5 h-3.5" />
                            </button>
                            <button onClick={() => deleteTask(task.id)} className="p-1.5 text-[#71717A] hover:text-red-400 cursor-pointer">
                              <Icon name="trash-2" className="w-3.5 h-3.5" />
                            </button>
                          </div>
                        </div>

                        {isExpanded && (
                          <div className="pt-2 border-t border-[#27272A]">
                            <textarea
                              rows={3}
                              value={task.notes || ''}
                              onChange={(e) => updateTaskNote(task.id, e.target.value)}
                              placeholder="Task notes..."
                              className="w-full text-xs text-[#D4D4D8] font-mono bg-[#18181B] border border-[#27272A] rounded-lg p-2 outline-none"
                            />
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </section>

            </div>

            {/* Middle Row — 📅 Interactive Monthly Calendar Overview */}
            <section className="bg-[#18181B] border border-[#27272A] rounded-xl p-6 shadow-md">
              <div className="flex items-center justify-between mb-6">
                <div className="flex items-center gap-2">
                  <span className="text-xl">📅</span>
                  <div>
                    <h2 className="text-base font-semibold text-[#FFFFFF]">Interactive Monthly Overview</h2>
                    <p className="text-[11px] text-[#71717A]">Click any date to add or edit notes, events, or deadlines</p>
                  </div>
                </div>

                <div className="flex items-center gap-2">
                  <button
                    onClick={resetToToday}
                    className="px-2.5 py-1 text-xs font-semibold bg-[#09090B] border border-[#27272A] text-[#E8DCC4] rounded-lg hover:bg-[#27272A] cursor-pointer"
                  >
                    Today
                  </button>
                  <div className="flex items-center bg-[#09090B] border border-[#27272A] rounded-lg p-0.5">
                    <button
                      onClick={prevMonth}
                      className="p-1 text-[#A1A1AA] hover:text-[#FFFFFF] cursor-pointer"
                      title="Previous Month"
                    >
                      <Icon name="chevron-left" className="w-4 h-4" />
                    </button>
                    <span className="text-xs font-bold text-[#FFFFFF] px-3 min-w-[120px] text-center">
                      {monthName}
                    </span>
                    <button
                      onClick={nextMonth}
                      className="p-1 text-[#A1A1AA] hover:text-[#FFFFFF] cursor-pointer"
                      title="Next Month"
                    >
                      <Icon name="chevron-right" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>

              {/* Calendar Grid */}
              <div className="grid grid-cols-7 gap-1.5 sm:gap-2 text-center">
                {/* Day Headers */}
                {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(dayHeader => (
                  <div key={dayHeader} className="text-[11px] font-bold uppercase tracking-wider text-[#71717A] py-1">
                    {dayHeader}
                  </div>
                ))}

                {/* Empty Offset Boxes */}
                {Array.from({ length: startingDay }).map((_, i) => (
                  <div key={`empty-${i}`} className="h-16 sm:h-20 bg-[#09090B]/30 border border-[#27272A]/30 rounded-xl opacity-20"></div>
                ))}

                {/* Month Days */}
                {Array.from({ length: daysInMonth }).map((_, i) => {
                  const dayNum = i + 1;
                  const monthNumStr = String(month + 1).padStart(2, '0');
                  const dayNumStr = String(dayNum).padStart(2, '0');
                  const dateKey = `${year}-${monthNumStr}-${dayNumStr}`;
                  
                  const isToday = dateKey === todayStr;
                  const hasNote = Boolean(calendarNotes[dateKey]);

                  return (
                    <div
                      key={dateKey}
                      onClick={() => openCalendarDayModal(dateKey)}
                      className={`h-16 sm:h-20 bg-[#09090B] border rounded-xl p-1.5 sm:p-2 flex flex-col justify-between transition-all cursor-pointer group hover:border-[#E8DCC4] text-left relative overflow-hidden ${
                        isToday ? 'border-[#E8DCC4] shadow-sm shadow-[#E8DCC4]/10' : 'border-[#27272A]'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className={`text-xs font-bold font-mono ${isToday ? 'text-[#E8DCC4]' : 'text-[#A1A1AA] group-hover:text-[#FFFFFF]'}`}>
                          {dayNum}
                        </span>
                        {hasNote && (
                          <span className="w-2 h-2 rounded-full bg-[#E8DCC4] shadow-sm animate-pulse"></span>
                        )}
                      </div>

                      {hasNote ? (
                        <p className="text-[10px] text-[#E4E4E7] font-sans truncate leading-tight line-clamp-2 mt-1">
                          {calendarNotes[dateKey]}
                        </p>
                      ) : (
                        <span className="text-[9px] text-[#3F3F46] opacity-0 group-hover:opacity-100 transition-opacity">
                          + add note
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            </section>

            {/* Bottom Grid Row */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
              
              {/* Ventures & Projects */}
              <section className="lg:col-span-6 bg-[#18181B] border border-[#27272A] rounded-xl p-6 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-5">
                    <div className="flex items-center gap-2">
                      <span className="text-xl">🚀</span>
                      <h2 className="text-base font-semibold text-[#FFFFFF]">Ventures &amp; Projects</h2>
                    </div>

                    <div className="flex bg-[#09090B] p-0.5 rounded-lg border border-[#27272A]">
                      <button onClick={() => setActiveExtraTab('ig')} className={`px-3 py-1 text-xs font-medium rounded-md cursor-pointer ${activeExtraTab === 'ig' ? 'bg-[#E8DCC4] text-[#09090B] font-bold' : 'text-[#A1A1AA]'}`}>
                        bayt al Ummah
                      </button>
                      <button onClick={() => setActiveExtraTab('coding')} className={`px-3 py-1 text-xs font-medium rounded-md cursor-pointer ${activeExtraTab === 'coding' ? 'bg-[#E8DCC4] text-[#09090B] font-bold' : 'text-[#A1A1AA]'}`}>
                        Coding &amp; Agency
                      </button>
                    </div>
                  </div>

                  {activeExtraTab === 'ig' && (
                    <div className="space-y-4">
                      <form onSubmit={addIgPost} className="flex gap-2">
                        <input
                          type="text"
                          required
                          placeholder="New Reel idea or caption draft..."
                          value={newIgTitle}
                          onChange={(e) => setNewIgTitle(e.target.value)}
                          className="flex-1 text-xs bg-[#09090B] border border-[#27272A] rounded-lg px-3 py-2 text-[#FFFFFF] outline-none"
                        />
                        <select value={newIgType} onChange={(e) => setNewIgType(e.target.value)} className="text-xs bg-[#09090B] border border-[#27272A] rounded-lg px-2 py-2 text-[#E4E4E7]">
                          <option value="Reel">Reel</option>
                          <option value="Carousel">Carousel</option>
                          <option value="Story">Story</option>
                        </select>
                        <button type="submit" onClick={addIgPost} className="px-3 py-2 bg-[#E8DCC4] text-[#09090B] rounded-lg text-xs font-bold cursor-pointer">Save</button>
                      </form>

                      <div className="space-y-2.5 max-h-[280px] overflow-y-auto">
                        {igPosts.map((post) => {
                          const isIgExpanded = expandedIgId === post.id;
                          return (
                            <div key={post.id} className="p-3.5 bg-[#09090B] border border-[#27272A] rounded-xl space-y-2">
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-semibold text-[#FFFFFF]">{post.title}</span>
                                <div className="flex items-center gap-2">
                                  <button onClick={() => setExpandedIgId(isIgExpanded ? null : post.id)} className="p-1 text-[#E8DCC4] cursor-pointer">
                                    <Icon name="file-text" className="w-3.5 h-3.5" />
                                  </button>
                                  <button onClick={() => deleteIgPost(post.id)} className="text-[#71717A] hover:text-red-400 cursor-pointer">
                                    <Icon name="trash-2" className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </div>
                              {isIgExpanded && (
                                <div className="pt-2 border-t border-[#27272A]">
                                  <textarea
                                    rows={3}
                                    value={post.notes || ''}
                                    onChange={(e) => updateIgNote(post.id, e.target.value)}
                                    placeholder="Draft script or captions here..."
                                    className="w-full text-xs text-[#D4D4D8] font-mono bg-[#18181B] border border-[#27272A] rounded-lg p-2 outline-none"
                                  />
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}

                  {activeExtraTab === 'coding' && (
                    <div className="space-y-4">
                      <form onSubmit={addCodeGoal} className="flex gap-2">
                        <input
                          type="text"
                          required
                          placeholder="Add goal (e.g. FastAPI tutorial)..."
                          value={newCodeGoal}
                          onChange={(e) => setNewCodeGoal(e.target.value)}
                          className="flex-1 text-xs bg-[#09090B] border border-[#27272A] rounded-lg px-3 py-2 text-[#FFFFFF] outline-none"
                        />
                        <button type="submit" onClick={addCodeGoal} className="px-3 py-2 bg-[#E8DCC4] text-[#09090B] rounded-lg text-xs font-bold cursor-pointer">Add Goal</button>
                      </form>

                      <div className="space-y-2 max-h-[280px] overflow-y-auto">
                        {codeGoals.map((goal) => {
                          const isGoalExpanded = expandedGoalId === goal.id;
                          return (
                            <div key={goal.id} className="p-3 bg-[#09090B] border border-[#27272A] rounded-xl space-y-2">
                              <div className="flex items-center justify-between">
                                <p onClick={() => toggleCodeGoal(goal.id)} className={`text-xs font-medium cursor-pointer ${goal.status === 'Done' ? 'line-through text-[#71717A]' : 'text-[#FFFFFF]'}`}>
                                  {goal.text}
                                </p>
                                <div className="flex items-center gap-2">
                                  <button onClick={() => setExpandedGoalId(isGoalExpanded ? null : goal.id)} className="p-0.5 text-[#E8DCC4] cursor-pointer">
                                    <Icon name="file-text" className="w-3.5 h-3.5" />
                                  </button>
                                  <button onClick={() => deleteCodeGoal(goal.id)} className="text-[#71717A] hover:text-red-400 cursor-pointer">
                                    <Icon name="trash-2" className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </div>

                              {isGoalExpanded && (
                                <div className="pt-2 border-t border-[#27272A]">
                                  <textarea
                                    rows={2}
                                    value={goal.notes || ''}
                                    onChange={(e) => updateGoalNote(goal.id, e.target.value)}
                                    placeholder="Technical notes..."
                                    className="w-full text-xs text-[#D4D4D8] font-mono bg-[#18181B] border border-[#27272A] rounded-lg p-2 outline-none"
                                  />
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              </section>

              {/* Note Vault */}
              <section className="lg:col-span-6 bg-[#18181B] border border-[#27272A] rounded-xl p-6 flex flex-col">
                <div className="flex items-center justify-between mb-5">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">📁</span>
                    <h2 className="text-base font-semibold text-[#FFFFFF]">Note Vault</h2>
                  </div>

                  <div className="flex items-center gap-2">
                    {openedFolderId === null ? (
                      <button onClick={() => setIsAddingFolder(!isAddingFolder)} className="px-2.5 py-1 text-xs font-semibold bg-[#09090B] border border-[#27272A] rounded-lg text-[#E8DCC4] cursor-pointer">
                        New Folder
                      </button>
                    ) : (
                      <button onClick={createNewNote} className="px-3 py-1.5 text-xs font-bold bg-[#E8DCC4] text-[#09090B] rounded-lg cursor-pointer">
                        New Document
                      </button>
                    )}
                  </div>
                </div>

                {openedFolderId === null && isAddingFolder && (
                  <form onSubmit={createFolder} className="flex gap-2 mb-4 bg-[#09090B] p-2 border border-[#27272A] rounded-xl">
                    <input
                      type="text"
                      required
                      placeholder="Folder Name..."
                      value={newFolderName}
                      onChange={(e) => setNewFolderName(e.target.value)}
                      className="flex-1 text-xs bg-[#18181B] border border-[#27272A] rounded-lg px-2.5 py-1.5 text-[#FFFFFF] outline-none"
                    />
                    <button type="submit" onClick={createFolder} className="px-3 py-1.5 bg-[#E8DCC4] text-[#09090B] font-bold text-xs rounded-lg cursor-pointer">Create</button>
                  </form>
                )}

                <div className="grid grid-cols-1 sm:grid-cols-12 gap-4 flex-1 min-h-[300px]">
                  
                  {/* Folder List / Inside Folder */}
                  <div className="sm:col-span-5 border-r-0 sm:border-r border-[#27272A] pr-0 sm:pr-3 space-y-3">
                    {openedFolderId === null ? (
                      <div className="space-y-2">
                        <p className="text-[10px] font-bold uppercase tracking-wider text-[#71717A] px-1">Folders ({folders.length})</p>
                        <div className="space-y-1.5">
                          {folders.map((f) => {
                            const count = notes.filter(n => n.folderId === f.id).length;
                            return (
                              <div
                                key={f.id}
                                onClick={() => { setOpenedFolderId(f.id); const match = notes.find(n => n.folderId === f.id); if (match) setActiveNoteId(match.id); }}
                                className="w-full flex items-center justify-between px-3 py-2 text-xs font-medium rounded-xl bg-[#09090B] border border-[#27272A] hover:border-[#E8DCC4] cursor-pointer group"
                              >
                                <div className="flex items-center gap-2.5">
                                  <span>{f.icon}</span>
                                  <div>
                                    <p className="text-xs font-bold text-[#FFFFFF]">{f.name}</p>
                                    <p className="text-[10px] text-[#71717A]">{count} doc{count !== 1 ? 's' : ''}</p>
                                  </div>
                                </div>
                                <div className="flex items-center gap-1.5">
                                  {folders.length > 1 && (
                                    <button onClick={(e) => deleteFolder(f.id, e)} className="p-1 text-[#71717A] hover:text-red-400 opacity-0 group-hover:opacity-100 cursor-pointer">
                                      <Icon name="trash-2" className="w-3.5 h-3.5" />
                                    </button>
                                  )}
                                  <Icon name="chevron-right" className="w-4 h-4 text-[#71717A]" />
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-2.5">
                        <button onClick={() => setOpenedFolderId(null)} className="flex items-center gap-1 text-xs font-semibold text-[#E8DCC4] hover:underline mb-1 cursor-pointer">
                          <Icon name="chevron-left" className="w-3.5 h-3.5" /> Back to Folders
                        </button>
                        <div className="flex items-center justify-between px-1">
                          <span className="text-xs font-bold text-[#FFFFFF]">{currentOpenedFolder?.name}</span>
                          <span className="text-[10px] text-[#71717A] font-mono bg-[#09090B] px-2 py-0.5 rounded border border-[#27272A]">{currentFolderNotes.length} Docs</span>
                        </div>

                        <div className="space-y-1 max-h-[220px] overflow-y-auto pr-1">
                          {currentFolderNotes.map((n) => (
                            <div
                              key={n.id}
                              onClick={() => setActiveNoteId(n.id)}
                              className={`w-full flex items-center justify-between px-2.5 py-2 text-xs rounded-lg cursor-pointer ${
                                activeNoteId === n.id ? 'bg-[#27272A] text-[#E8DCC4] font-semibold border border-[#3F3F46]' : 'text-[#A1A1AA] hover:bg-[#09090B]'
                              }`}
                            >
                              <span className="truncate">{n.title || 'Untitled Document'}</span>
                              <button onClick={(e) => deleteNote(n.id, e)} className="text-[#71717A] hover:text-red-400 cursor-pointer">
                                <Icon name="x" className="w-3 h-3" />
                              </button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Document Editor */}
                  <div className="sm:col-span-7 flex flex-col bg-[#09090B] border border-[#27272A] rounded-xl p-3.5">
                    {activeNoteId ? (
                      <>
                        <input
                          type="text"
                          placeholder="Document Title"
                          value={noteTitle}
                          onChange={(e) => handleNoteChange('title', e.target.value)}
                          className="w-full text-xs font-bold border-b border-[#27272A] pb-2 mb-2 text-[#FFFFFF] bg-transparent outline-none focus:border-[#E8DCC4]"
                        />
                        <textarea
                          placeholder="Type notes or strategy..."
                          value={noteContent}
                          onChange={(e) => handleNoteChange('content', e.target.value)}
                          className="w-full flex-1 text-xs text-[#D4D4D8] font-mono bg-transparent resize-none outline-none"
                          rows={9}
                        />
                      </>
                    ) : (
                      <div className="h-full flex items-center justify-center text-center">
                        <p className="text-xs text-[#71717A]">Select or create a document to start editing</p>
                      </div>
                    )}
                  </div>

                </div>
              </section>

            </div>

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DashboardApp />);
  </script>
</body>
</html>
